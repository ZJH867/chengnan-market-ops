name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true
      - name: Assemble site
        run: |
          mkdir -p _site
          # Prefer prebuilt site/ if present; else repo root static files
          if [ -d site ] && [ -f site/index.html ]; then
            cp -a site/. _site/
          else
            # repo root is already the static site
            shopt -s dotglob
            for f in *; do
              case "$f" in
                .git|.github|node_modules|src|scripts|public|_site|site) ;;
                *) cp -a "$f" _site/ ;;
              esac
            done
          fi
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
